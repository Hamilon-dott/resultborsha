<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .bd-gov-wrapper { font-family: Arial, sans-serif; width: 100%; color: #000; background: #fff; padding: 20px 25px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .bd-gov-header { text-align: center; border-bottom: 2px solid #008000; padding-bottom: 12px; margin-bottom: 20px; }
    .bd-gov-header h2 { color: #008000; font-size: 20px; margin: 0 0 8px 0; text-transform: uppercase; font-weight: bold; }
    .bd-gov-header h3 { color: #000; font-size: 15px; margin: 0; font-weight: normal; }
    
    .bd-gov-title { background-color: #e6e6e6; color: #000; padding: 8px; font-weight: bold; font-size: 14px; text-align: center; border: 1px solid #a9a9a9; margin-bottom: 15px; text-transform: uppercase; }
    
    .bd-gov-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; font-size: 13px; }
    .bd-gov-table th, .bd-gov-table td { border: 1px solid #a9a9a9; padding: 7px 10px; text-align: left; vertical-align: middle; }
    .bd-gov-table th { background-color: #eeeeee; font-weight: normal; color: #333; width: 22%; }
    .bd-gov-table td { background-color: #f9f9f9; font-weight: bold; width: 28%; }
    .bd-gov-table tr:nth-child(even) td { background-color: #fdfdfd; }
    .bd-gov-table tr:nth-child(even) th { background-color: #f4f4f4; }
    
    .bd-gov-table-marks { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
    .bd-gov-table-marks th, .bd-gov-table-marks td { border: 1px solid #a9a9a9; padding: 7px 10px; }
    .bd-gov-table-marks th { background-color: #eeeeee; font-weight: bold; color: #000; text-align: center; }
    .bd-gov-table-marks td { background-color: #fff; text-align: left; font-weight: bold;}
    .bd-gov-table-marks td:nth-child(1), .bd-gov-table-marks td:nth-child(3) { text-align: center; }
    
    @media (max-width: 600px) {
      .bd-gov-table th, .bd-gov-table td { display: block; width: 100% !important; text-align: left !important; }
      .bd-gov-table th { background-color: #e2e8f0; font-weight: bold; }
    }
  </style>
</head>
<body>
  <div class="bd-gov-wrapper">
    <div class="bd-gov-header">
      <h2>Ministry of Education</h2>
    </div>
    
    <table class="bd-gov-table">
      <tr>
        <th>Roll No</th>
        <td>123456</td>
        <th>Name of Student</th>
        <td>Student Name</td>
      </tr>
      <tr>
        <th>Board</th>
        <td>Dhaka</td>
        <th>Father's Name</th>
        <td>Father Name</td>
      </tr>
    </table>
  </div>
</body>
</html>
